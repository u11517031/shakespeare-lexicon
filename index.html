      --bg-card: #FFFDF9;
      --velvet-burgundy: #3B1319;
      --velvet-dark: #250A0E;
      --antique-gold: #B08D57;
      --gold-light: #DFC89A;
      --ink-primary: #1F1B18;
      --ink-secondary: #584E45;
      --border-subtle: rgba(176, 141, 87, 0.35);
      --shadow-museum: 0 12px 32px rgba(31, 27, 24, 0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-parchment);
      color: var(--ink-primary);
      font-family: 'Noto Serif TC', Georgia, serif;
      line-height: 1.65;
      background-image: radial-gradient(rgba(176, 141, 87, 0.08) 1px, transparent 0);
      background-size: 24px 24px;
    }

      padding: 2.5rem 1.5rem 2rem;
      text-align: center;
      border-bottom: 3px solid var(--antique-gold);
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.25);
    }

    .museum-subtitle {
      font-family: 'Cinzel', serif;
      letter-spacing: 0.25em;
      font-size: 0.85rem;
      color: var(--gold-light);
      text-transform: uppercase;
      margin-bottom: 0.5rem;
    }

      font-family: 'Cinzel', serif;
      font-size: clamp(1.8rem, 4vw, 2.8rem);

      margin-bottom: 0.4rem;
    }

      padding: 0 1rem;

      flex-wrap: wrap;
      gap: 0.75rem;
      justify-content: center;
      align-items: center;
      position: relative;
      z-index: 10;
    }

    .mode-tabs {
      display: inline-flex;
      background: var(--bg-card);
      border: 1px solid var(--antique-gold);
      border-radius: 999px;
      padding: 0.25rem;
      box-shadow: var(--shadow-museum);

      border: none;
      background: transparent;
      padding: 0.5rem 1.25rem;
      border-radius: 999px;
      font-family: 'Noto Serif TC', serif;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--ink-secondary);
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .tab-btn.active {
      background: var(--velvet-burgundy);
      color: var(--gold-light);
    }

    .search-box {
      background: var(--bg-card);
      border: 1px solid var(--antique-gold);
      border-radius: 999px;
      padding: 0.55rem 1.2rem;
      font-family: 'Noto Serif TC', serif;
      font-size: 0.9rem;
      color: var(--ink-primary);
      width: 240px;
      box-shadow: var(--shadow-museum);
      outline: none;
    }

    /* A-Z 字母快速導覽索引 */
    .az-index {
      max-width: 1240px;
      margin: 0 auto 2rem;
      padding: 0 1rem;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.35rem;
    }

    .az-pill {
      width: 34px;
      height: 34px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border-subtle);
      background: var(--bg-card);
      color: var(--velvet-burgundy);
      font-family: 'Cinzel', serif;
      font-weight: 700;
      font-size: 0.85rem;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .az-pill:hover, .az-pill.active {
      background: var(--velvet-burgundy);
      color: var(--gold-light);
      border-color: var(--velvet-burgundy);
    }

    main {
      max-width: 1240px;
      margin: 0 auto 4rem;
      padding: 0 1.25rem;
    }

      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 2rem;
    }

    .lexicon-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      overflow: hidden;
      box-shadow: var(--shadow-museum);
      display: flex;
      flex-direction: column;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      position: relative;
    }

    .lexicon-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 16px 36px rgba(31, 27, 24, 0.14);
    }

      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      background: #231F1D;
      border-bottom: 2px solid var(--antique-gold);
      overflow: hidden;
    }

    .painting-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.5s ease;
    }

    .lexicon-card:hover .painting-frame img {
      transform: scale(1.03);
    }

    .letter-badge {
      position: absolute;
      top: 12px;
      left: 12px;
      width: 38px;
      height: 38px;
      background: rgba(37, 10, 14, 0.88);
      border: 1px solid var(--antique-gold);
      color: var(--gold-light);
      font-family: 'Cinzel', serif;
      font-size: 1.15rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      backdrop-filter: blur(4px);
    }

    .card-body {
      padding: 1.4rem 1.5rem 1.6rem;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .word-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 0.5rem;
      margin-bottom: 0.25rem;
      flex-wrap: wrap;

      font-family: 'Cormorant Garamond', serif;
      font-size: 1.85rem;
      font-weight: 700;
      color: var(--velvet-burgundy);
      line-height: 1.2;

    .word-phonetic {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1rem;
      color: var(--ink-secondary);
      font-style: italic;
    }

    .word-meaning {
      font-size: 1rem;
      font-weight: 600;
      color: var(--ink-primary);
      margin-bottom: 1rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px dashed var(--border-subtle);
    }

      background: rgba(176, 141, 87, 0.08);
      border-left: 3px solid var(--antique-gold);
      padding: 0.85rem 1rem;
      margin-bottom: 1rem;
      border-radius: 0 4px 4px 0;

      font-size: 1.15rem;
      font-style: italic;
      font-weight: 600;
      color: var(--ink-primary);

      line-height: 1.45;

      justify-content: center;
      gap: 0.4rem;

      background: transparent;
      color: var(--velvet-burgundy);

      font-size: 0.84rem;
      font-weight: 600;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s ease;

      color: var(--gold-light);

      display: flex;
      justify-content: space-between;
      max-width: 960px;
      margin: 1rem auto 0;
    }

      padding: 0.6rem 1.3rem;
      background: var(--bg-card);
      border: 1px solid var(--antique-gold);
      color: var(--velvet-burgundy);
      font-family: 'Noto Serif TC', serif;
      font-weight: 600;
      border-radius: 4px;
      cursor: pointer;
    }

    .nav-arrow:hover {
      background: var(--velvet-burgundy);
      color: var(--gold-light);

      max-width: 680px;
      margin: 0 auto;
      background: var(--bg-card);
      border: 1px solid var(--antique-gold);
      border-radius: 8px;
      padding: 2rem;
      box-shadow: var(--shadow-museum);
      text-align: center;
    }

    .quiz-img {
      width: 240px;
      height: 240px;
      object-fit: cover;
      border: 2px solid var(--antique-gold);
      border-radius: 4px;
      margin: 0 auto 1.25rem;
      display: block;
    }

    .quiz-options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.8rem;
      margin-top: 1.5rem;
    }

    .quiz-opt {
      padding: 0.85rem;
      border: 1px solid var(--border-subtle);
      background: var(--bg-parchment);
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--ink-primary);
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .quiz-opt:hover { border-color: var(--velvet-burgundy); }
    .quiz-opt.correct { background: #2E5A36; color: #FFF; border-color: #2E5A36; }
    .quiz-opt.wrong { background: #8B2626; color: #FFF; border-color: #8B2626; }

    footer {
      text-align: center;
      padding: 2rem 1rem;
      border-top: 1px solid var(--border-subtle);
      color: var(--ink-secondary);
      font-size: 0.85rem;

</head>

let currentMode = "gallery";
let currentLetter = "ALL";
let focusIndex = 0;
let currentAudio = null;

function getImgPath(item) {
  return `assets/images/${item.letter.toLowerCase()}-${item.word}.jpg`;
}

function getAudioPath(item, type) {
  return `assets/audio/${item.letter.toLowerCase()}-${item.word}-${type}.mp3`;
}

// 播放真實 MP3，若本地尚未放入檔案則自動降級使用瀏覽器英式語音朗讀
function playAudio(letter, type, btnElement) {
  const item = LEXICON_DATA.find(d => d.letter === letter);
  if (!item) return;

  if (currentAudio) {
    currentAudio.pause();
    currentAudio = null;
  }
  window.speechSynthesis.cancel();
  document.querySelectorAll('.audio-btn').forEach(b => b.classList.remove('playing'));

  if (btnElement) btnElement.classList.add('playing');

  const audioSrc = getAudioPath(item, type);
  const audio = new Audio(audioSrc);
  currentAudio = audio;

  audio.onended = () => {
    if (btnElement) btnElement.classList.remove('playing');
  };

  audio.onerror = () => {
    // 備援：Web Speech API 英式發音
    const textToSpeak = type === 'word' ? item.word : item.quoteEn;
    const utter = new SpeechSynthesisUtterance(textToSpeak);
    utter.lang = 'en-GB';
    utter.rate = 0.88;
    utter.onend = () => {
      if (btnElement) btnElement.classList.remove('playing');
    };
    window.speechSynthesis.speak(utter);
  };

  audio.play().catch(() => {
    audio.onerror();
  });
}

function renderAZIndex() {
  const container = document.getElementById("azIndex");
  const allBtn = `<button class="az-pill ${currentLetter === 'ALL' ? 'active' : ''}" onclick="filterLetter('ALL')">ALL</button>`;
  const letters = LEXICON_DATA.map(item =>
    `<button class="az-pill ${currentLetter === item.letter ? 'active' : ''}" onclick="filterLetter('${item.letter}')">${item.letter}</button>`
  ).join("");
  container.innerHTML = allBtn + letters;
}

function filterLetter(letter) {
  currentLetter = letter;
  if (letter !== "ALL") {
    const idx = LEXICON_DATA.findIndex(d => d.letter === letter);
    if (idx !== -1) focusIndex = idx;
  }
  renderAZIndex();
  renderApp();
}

function renderGallery(items) {
  const app = document.getElementById("appContainer");
  if (items.length === 0) {
    app.innerHTML = `<p style="text-align:center; padding:3rem; color:var(--ink-secondary);">找不到符合搜尋條件的詞彙，請嘗試其他關鍵字。</p>`;
    return;
  }
  app.innerHTML = `<div class="gallery-grid">${items.map(item => `
    <article class="lexicon-card">
      <div class="painting-frame">
        <span class="letter-badge">${item.letter}</span>
        <img src="${getImgPath(item)}" alt="${item.word}" loading="lazy"
             onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22400%22 height=%22400%22><rect width=%22100%25%22 height=%22100%25%22 fill=%22%232D241E%22/><text x=%2250%25%22 y=%2250%25%22 fill=%22%23DFC89A%22 font-family=%22Georgia%22 font-size=%2222%22 text-anchor=%22middle%22 dy=%22.3em%22>${item.letter} — ${item.word}</text></svg>'" />
      </div>
      <div class="card-body">
        <div class="word-header">
          <h2 class="word-title">${item.word}</h2>
          <span class="word-phonetic">${item.phonetic} (${item.pos})</span>
        </div>
        <div class="word-meaning">${item.meaning}</div>
        <div class="quote-box">
          <div class="quote-en">“${item.quoteEn}”</div>
          <div class="quote-zh">${item.quoteZh}</div>
          <div class="quote-source">— ${item.source}</div>
        </div>
        <div class="audio-controls">
          <button class="audio-btn" onclick="playAudio('${item.letter}', 'word', this)">🔊 單字發音</button>
          <button class="audio-btn" onclick="playAudio('${item.letter}', 'quote', this)">🎭 台詞朗誦</button>
        </div>
      </div>
    </article>
  `).join("")}</div>`;
}

function renderFocus() {
  const item = LEXICON_DATA[focusIndex];
  const app = document.getElementById("appContainer");
  app.innerHTML = `
    <div class="focus-container">
      <div class="painting-frame" style="border-bottom:none; border-right:2px solid var(--antique-gold);">
        <span class="letter-badge">${item.letter}</span>
        <img src="${getImgPath(item)}" alt="${item.word}" />
      </div>
      <div class="card-body" style="padding:2rem;">
        <div class="word-header">
          <h2 class="word-title" style="font-size:2.4rem;">${item.word}</h2>
          <span class="word-phonetic">${item.phonetic} (${item.pos})</span>
        </div>
        <div class="word-meaning" style="font-size:1.15rem;">${item.meaning}</div>
        <div class="quote-box">
          <div class="quote-en" style="font-size:1.25rem;">“${item.quoteEn}”</div>
          <div class="quote-zh">${item.quoteZh}</div>
          <div class="quote-source">— ${item.source}</div>
        </div>
        <p style="font-size:0.92rem; color:var(--ink-secondary); margin-bottom:1.2rem;">
          <strong>文學導讀：</strong>${item.note}
        </p>
        <div class="audio-controls">
          <button class="audio-btn" onclick="playAudio('${item.letter}', 'word', this)">🔊 單字發音</button>
          <button class="audio-btn" onclick="playAudio('${item.letter}', 'quote', this)">🎭 台詞朗誦</button>
        </div>
      </div>
    </div>
    <div class="focus-nav">
      <button class="nav-arrow" onclick="stepFocus(-1)">← 上一個字母</button>
      <span style="align-self:center; font-family:'Cinzel', serif; color:var(--velvet-burgundy); font-weight:700;">
        ${focusIndex + 1} / ${LEXICON_DATA.length}
      </span>
      <button class="nav-arrow" onclick="stepFocus(1)">下一個字母 →</button>
    </div>
  `;
}

function stepFocus(delta) {
  focusIndex = (focusIndex + delta + LEXICON_DATA.length) % LEXICON_DATA.length;
  currentLetter = LEXICON_DATA[focusIndex].letter;
  renderAZIndex();
  renderFocus();
}

function renderQuiz() {
  const target = LEXICON_DATA[Math.floor(Math.random() * LEXICON_DATA.length)];
  const distractors = LEXICON_DATA.filter(d => d.letter !== target.letter)
    .sort(() => 0.5 - Math.random()).slice(0, 3);
  const options = [target, ...distractors].sort(() => 0.5 - Math.random());

  const app = document.getElementById("appContainer");
  app.innerHTML = `
    <div class="quiz-box">
      <div style="font-family:'Cinzel', serif; color:var(--antique-gold); font-weight:700; margin-bottom:0.5rem;">
        VISUAL & LITERARY CHALLENGE
      </div>
      <h3 style="margin-bottom:1rem;">請根據油畫意象與劇本引文，選出正確的莎劇詞彙：</h3>
      <img class="quiz-img" src="${getImgPath(target)}" alt="Quiz Painting" />
      <p style="font-family:'Cormorant Garamond', serif; font-size:1.2rem; font-style:italic; margin-bottom:0.4rem;">
        “${target.quoteEn}”
      </p>
      <p style="font-size:0.9rem; color:var(--ink-secondary);">${target.meaning}（${target.source}）</p>
      <div class="quiz-options">
        ${options.map(opt => `
          <button class="quiz-opt" onclick="checkQuiz(this, '${opt.word}', '${target.word}', '${target.letter}')">
            ${opt.word}
          </button>
        `).join("")}
      </div>
      <div id="quizFeedback" style="margin-top:1.2rem; font-weight:600;"></div>
    </div>
  `;
}

function checkQuiz(btn, chosen, answer, letter) {
  const buttons = document.querySelectorAll(".quiz-opt");
  buttons.forEach(b => b.disabled = true);
  const fb = document.getElementById("quizFeedback");

  if (chosen === answer) {
    btn.classList.add("correct");
    fb.innerHTML = `<span style="color:#2E5A36;">答對了！</span> <button class="nav-arrow" style="margin-left:0.8rem;" onclick="renderQuiz()">下一題 →</button>`;
    playAudio(letter, 'word', null);
  } else {
    btn.classList.add("wrong");
    buttons.forEach(b => { if (b.textContent.trim() === answer) b.classList.add("correct"); });
    fb.innerHTML = `<span style="color:#8B2626;">正確答案是 ${answer}</span> <button class="nav-arrow" style="margin-left:0.8rem;" onclick="renderQuiz()">下一題 →</button>`;
  }
}

function renderApp() {
  const query = document.getElementById("searchInput").value.trim().toLowerCase();
  if (currentMode === "focus") {
    renderFocus();
    return;
  }
  if (currentMode === "quiz") {
    renderQuiz();
    return;
  }
  const filtered = LEXICON_DATA.filter(item => {
    const matchLetter = currentLetter === "ALL" || item.letter === currentLetter;
    const matchQuery = !query ||
      item.word.toLowerCase().includes(query) ||
      item.meaning.includes(query) ||
      item.source.toLowerCase().includes(query);
    return matchLetter && matchQuery;
  });
  renderGallery(filtered);
}

document.querySelectorAll(".tab-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    currentMode = btn.dataset.mode;
    renderApp();
  });
});

document.getElementById("searchInput").addEventListener("input", () => {
  if (currentMode !== "gallery") {
    currentMode = "gallery";
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.toggle("active", b.dataset.mode === "gallery"));
  }
  renderApp();
});

renderAZIndex();
renderApp();
</script>
